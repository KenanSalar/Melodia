# `cargo fmt` passes the edition, but a bare `rustfmt` — what an editor runs on
# save — falls back to 2015, chokes on let chains and reflows 150 sites. Pinning
# both is what makes format-on-save agree with the CI gate.
edition = "2024"
style_edition = "2024"

# Every width heuristic tracks `max_width`, which stays at its 100 default, rather
# than the percentage defaults that split code already fitting the 100 columns
# this tree was hand-written to.
#
# The mode rather than per-setting numbers, and that part is load-bearing: rustfmt
# re-validates an *explicitly set* width against a throwaway config it builds for
# a `macro_rules!` body, whose `max_width` is only what that body's shape leaves.
# Anything above the narrowest macro in the tree then prints a "cannot have a
# value that exceeds `max_width`" warning on every run, and that threshold is a
# property of the macro rather than of the config, so hand-picked numbers re-trip
# it as code moves. Derived widths skip the check.
# rust-lang/rustfmt#4919 and #6074, both closed as not planned.
use_small_heuristics = "Max"
