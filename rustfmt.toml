# `cargo fmt` passes the edition, but a bare `rustfmt` — what an editor runs on
# save — falls back to 2015, chokes on let chains and reflows 150 sites. Pinning
# both is what makes format-on-save agree with the CI gate.
edition = "2024"
style_edition = "2024"

# Sub-widths, not line lengths — `max_width` stays at its 100 default. These gate
# when a call's arguments or a chain get broken up, and their 60% defaults split
# code that already fits the 100 columns this tree was hand-written to.
#
# Just under `max_width` rather than at it, which is a judgement call: nothing
# forces the exact number.
#
# `cargo fmt` prints a "cannot have a value that exceeds `max_width`" warning for
# each of these on every run, and both are false. rustfmt re-validates them
# against a throwaway config it builds for a `macro_rules!` body, whose
# `max_width` is whatever that body's own shape leaves rather than the real 100;
# `ui::callbacks::tags::open` holds the one macro in the tree leaving less than
# 91. The clamp reaches that body and nothing else, so both values are live
# wherever the formatter actually decides anything, and `--check` still exits 0.
# rust-lang/rustfmt#4919 and #6074, both closed as not planned. Lowering them to
# silence it is chasing a moving target: that budget is a property of one macro's
# body, and it differs at every macro in the tree.
fn_call_width = 91
chain_width = 91
