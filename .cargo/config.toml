# Cap parallel compilation across all cargo subcommands (build, clippy, check,
# test, run, bench) to 8. Cargo hands rustc a jobserver, so this bounds combined
# crate + codegen-unit parallelism, not just the rustc process count.
[build]
jobs = 8

# build.jobs does not touch the test harness's runtime threads — cap those too.
# Non-forced: a dev can still override by exporting RUST_TEST_THREADS themselves.
[env]
RUST_TEST_THREADS = "8"

# The repo root, for the corpus walks that ask a question of the *tree* rather
# than of one package. `CARGO_MANIFEST_DIR` answered that only while the tree
# was one crate; cargo resolves this against the directory holding `.cargo`, so
# it keeps meaning the root once packages move under it.
MELODIA_REPO_ROOT = { value = "", relative = true }
