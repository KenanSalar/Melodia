# cargo-audit config. `.github/actions/cargo-audit` owns the flags and both callers;
# `.claude/rules/ci-packaging.md` argues the policy and why a stale entry here sits on the
# critical path of unrelated work.
#
# Rules for adding an entry to `ignore`:
#
#   1. Include the advisory ID, the reason it doesn't apply to Melodia, and a `revisit:` date.
#   2. Prefer pinning around the flagged crate, or removing the dep, over ignoring. Use this list
#      only for transitive deps with no upgrade path that we've confirmed are safe to ship.
#   3. Re-evaluate every `revisit:` date. Stale entries are worse than none — they hide real
#      findings.
#
# Format: https://github.com/RustSec/rustsec/tree/main/cargo-audit#configuration

[advisories]
ignore = [
    # bincode 2.0.1 unmaintained: in the lockfile only, as the optional `bincode` feature of
    # typed-index-collections 3.5.0 under i-slint-compiler 1.18.1. Nothing enables it, so it is
    # never built. No upstream tracking issue.
    # revisit: 2026-12-11
    "RUSTSEC-2025-0141",

    # ttf-parser 0.25.1 unmaintained: via winit's Wayland decorations (sctk-adwaita → ab_glyph →
    # owned_ttf_parser), Linux only, with no newer ttf-parser to update to. Parses installed
    # system fonts, never downloaded content. Leaves once Slint's winit backend asks for the
    # skrifa-drawn decorations rather than ab_glyph's.
    # revisit: 2026-12-11
    "RUSTSEC-2026-0192",

    # paste 1.0.15 unmaintained: via lofty 0.25.4 (direct), which has no migration plan.
    # revisit: 2026-12-11
    "RUSTSEC-2024-0436",
]
