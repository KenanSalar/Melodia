# cargo-audit config. Consumed by `cargo audit` in `.github/workflows/release.yml`
# (the `audit` job, which runs `cargo audit --deny unsound --deny unmaintained`).
#
# `--deny unmaintained` is correct policy: a flagged advisory should block the
# release until the team decides what to do. The escape hatch lives here.
#
# Rules for adding an entry to `ignore`:
#
#   1. Include the advisory ID, the reason it doesn't apply to Melodia,
#      and a `revisit:` date.
#   2. Prefer pinning around the flagged crate (or removing the dep) over
#      ignoring. Use this list only for transitive deps with no upgrade
#      path that we've confirmed are safe to ship.
#   3. Re-evaluate every `revisit:` date. Stale entries are worse than no
#      entries — they hide real findings.
#
# The format is documented at
# https://github.com/RustSec/rustsec/tree/main/cargo-audit#configuration

[advisories]
ignore = [
    # bincode 2.0.1 unmaintained — pulled via i-slint-compiler 1.16.1 →
    # typed-index-collections 3.5.0. Slint 1.16.1 is current; no upstream
    # tracking issue. Build-time only (proc-macro / build.rs).
    # revisit: 2026-08-19
    "RUSTSEC-2025-0141",

    # quick-xml 0.39.4 DoS advisories (quadratic duplicate-attribute check,
    # unbounded namespace allocation) — pulled only via wayland-scanner
    # 0.31.10, a build-time proc-macro that parses the *vendored* Wayland
    # protocol XML shipped in the wayland-protocols crates; no
    # attacker-controlled input ever reaches it. wayland-scanner pins
    # quick-xml `^0.39`, so no upgrade path to the fixed >=0.41 exists
    # until smithay releases against it.
    # revisit: 2026-10-06
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # ttf-parser 0.25.1 unmaintained — pulled via i-slint-compiler /
    # i-slint-core 1.16.1 → resvg 0.47 → usvg → fontdb. Slint 1.16.1 is
    # current; no newer ttf-parser exists to update to. Parses only fonts
    # bundled in the binary and installed system fonts, not downloaded
    # content.
    # revisit: 2026-10-06
    "RUSTSEC-2026-0192",

    # paste 1.0.15 unmaintained — pulled via lofty 0.24.0 (direct dep) and
    # rav1e 0.8.1 (transitive: slint → image → ravif → rav1e). Lofty has
    # no migration plan; rav1e's pastey migration (PR #3430) merged
    # 2025-06-22 but is unreleased.
    # revisit: 2026-08-19
    "RUSTSEC-2024-0436",
]
