name: PR Validation

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Purely the merge gate, so the right answer for a docs-only PR is nothing.
  changes:
    name: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # paths-filter lists a PR's changed files via the API
      actions: write        # skip-duplicate-actions' documented minimum
    outputs:
      # One verdict rather than two raw signals, because every job downstream
      # combines them the same way and six copies of that expression is six
      # chances to spell the skip as a pass. `workflow_dispatch` bypasses the
      # filters: no base ref to diff against.
      run: >-
        ${{ github.event_name == 'workflow_dispatch' ||
        (steps.paths.outputs.code == 'true' && steps.skip_check.outputs.should_skip != 'true') }}
    steps:
      # A DENYLIST, never source globs: the gate counts `skipped` as a pass, so
      # an allowlist merges an unlisted path green with nothing run.
      # `predicate-quantifier: every` is what makes the `!` lines do anything,
      # the default `some` plus `**` matching every file and never skipping.
      # `assets/` and `.github/` are excluded per file, both holding real inputs
      # (`melodia.ico`, three `include_*!`d payloads); the rule file says which.
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: paths
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!.claude/**'
              - '!.github/workflows/refresh-manifest.yml'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/FUNDING.yml'
              - '!assets/screenshots/**'
              - '!.gitignore'
              - '!.env.example'

      # Catches the identical tree arriving twice (rebase, revert, rename). No
      # `paths_filter` on purpose: a second copy of that list drifts to a green.
      - uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        id: skip_check

  # release.yml's gate moved forward, so a vulnerable dep surfaces while the
  # Cargo.lock change is under review rather than mid-release. Shared composite
  # so the two can't disagree; sibling of clippy, not a parent, so an advisory
  # hit doesn't hide the lint and test results.
  audit:
    name: audit
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.run == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/cargo-audit

  # Compiles nothing, so no system deps and no cache. Sibling for audit's reason.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.run == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No shared-key, so no cache: this job compiles nothing to cache.
      - uses: ./.github/actions/setup-rust
      - name: cargo fmt
        run: cargo fmt --all --check

  # Mirrors the local gate, `-D warnings` promoting the workspace `[lints]`' warn
  # level.
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.run == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/linux-system-deps
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: ci-clippy
      # `--workspace` is redundant against a virtual root with no `default-members`,
      # which already selects every member, and spelled anyway: it is what keeps the
      # gate whole if either of those stops being true. Lints don't depend on it at
      # all — cargo sets RUSTC_WORKSPACE_WRAPPER=clippy-driver for every member it
      # compiles, so a member's lib is linted however it got selected.
      - name: cargo clippy
        run: cargo clippy --all-targets --locked --workspace -- -D warnings

  # The full suite, `tests/headless.rs` included, and plain `cargo test`: nobody
  # reads a coverage delta to decide a merge, so deploy-coverage.yml runs the
  # instrumented build on demand. The `CARGO_BUILD_JOBS: 4` memory cap overrides
  # .cargo/config.toml's jobs=8: past the ceiling nothing fails, it swaps, and
  # the job looks like a hang. `line-tables-only` is a build-time cap rather
  # than a memory one: `cargo test` links 42 test binaries and full debuginfo
  # is most of that tail, while file:line survives for the backtraces this job
  # exists to print — hence not the `0` deploy-coverage.yml sets. Both profiles,
  # since `cargo test` builds dependencies under `dev` and test targets under
  # `test`.
  test:
    name: test
    runs-on: ubuntu-latest
    needs: [changes]
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    if: needs.changes.outputs.run == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/linux-system-deps
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: ci-test
      - uses: ./.github/actions/headless-audio

      - name: cargo test
        run: cargo test --locked --workspace

  # The clippy table's Windows half. `test-windows` type-checks these arms, but
  # `[workspace.lints.clippy]` needs clippy-driver and nothing had ever pointed
  # one at a `cfg(windows)` arm: `release-build.yml` is `cargo build`, lib and
  # bin. A sibling so a lint failure doesn't hide the test results, and it sets
  # no `CARGO_BUILD_JOBS`, a check-only build never reaching that peak.
  clippy-windows:
    name: clippy-windows
    runs-on: windows-latest
    needs: [changes]
    if: needs.changes.outputs.run == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: ci-clippy
      - name: cargo clippy
        run: cargo clippy --all-targets --locked --workspace -- -D warnings

  # The suite's Windows half, and the only place it has ever run:
  # `release-build.yml` compiles the Windows lib and bin, but only on a tag and
  # it runs no test.
  # Same two caps as `test`, the runner being the same 4-core / 16 GB box. The
  # debuginfo one is worth more here than there, MSVC PDBs being the heaviest
  # form of it: it took over 40% off this job's build against Linux's 30%. Why
  # neither Windows job takes system deps or a pinned image label is in the rule
  # file.
  test-windows:
    name: test-windows
    runs-on: windows-latest
    needs: [changes]
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    if: needs.changes.outputs.run == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          # rust-cache appends the OS after the key, so Linux's verbatim is fine.
          shared-key: ci-test

      # `headless_scan_persists_track` opens the default output device, and short
      # of a signed virtual driver WASAPI has no equivalent of the null PCM the
      # Linux job uses. Skipped by name, not by target selection, so a new
      # integration test runs here by default — the denylist argument again.
      - name: cargo test
        run: cargo test --locked --workspace -- --skip headless_scan_persists_track

  # Mark THIS as the required status check in branch protection. Green iff every
  # job passed or was skipped, `skipped` as a pass being what lets a docs-only PR
  # merge without a build, and why `changes` is a denylist.
  pr-validation:
    name: pr-validation
    if: always()
    needs: [changes, audit, fmt, clippy, test, clippy-windows, test-windows]
    runs-on: ubuntu-latest
    steps:
      # Derived from `needs:` above rather than restating it, so adding a job is
      # one edit. `toJSON` can't see a job that never reached `needs:`; that half
      # is pinned by `crates/melodia/tests/packaging.rs`'s
      # `the_aggregate_waits_on_every_job_in_the_gate_workflow`. Through `env:`
      # rather than `${{ }}` in the script, interpolating into bash being the
      # shape that goes wrong.
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          not_green="$(jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "  \(.key): \(.value.result)"' <<<"$NEEDS")"

          if [[ -n "$not_green" ]]; then
            echo "Jobs that failed or were cancelled:"
            echo "$not_green"
            exit 1
          fi
          echo "All jobs passed or were skipped"
