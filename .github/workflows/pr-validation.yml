name: PR Validation

on:
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Two-phase skip detection. This workflow is purely the merge gate, so the
  # cheapest correct answer for a docs-only PR is "nothing".
  changes:
    name: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # paths-filter lists a PR's changed files via the API
      actions: write        # skip-duplicate-actions' documented minimum
    outputs:
      code: ${{ steps.paths.outputs.code }}
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      # A DENYLIST — `**` plus exclusions, never a list of source globs. The gate
      # job below counts `skipped` as a pass, so an allowlist fails open: a path
      # nobody remembered to list merges green with zero checks run. Here a new
      # directory defaults to "run everything" and the exclusions are the part
      # under review.
      #
      # `predicate-quantifier: every` is load-bearing. The default (`some`) makes
      # a filter true when a file matches ANY pattern, and every file matches
      # `**` — so the `!` lines would silently do nothing and this job would
      # never skip. It builds, it looks right, and it is wrong.
      #
      # `assets/` and `.github/` are split per-path rather than excluded
      # wholesale, because both hold real inputs to this build: `melodia.ico`
      # plus three `include_*!`d payloads under the first, and under the second
      # the two composites these jobs `uses:`, this file (it IS the gate), and
      # `release.yml` + `LICENSE` — which compile nothing but are read by
      # `services::tests`, so excluding them let a PR skip the very pins that
      # exist to catch their second copy drifting. Anything added later defaults
      # to running everything; earning a line below is the deliberate part.
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: paths
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!.claude/**'
              - '!.github/workflows/close-linked-issues.yml'
              - '!.github/workflows/deploy-coverage.yml'
              - '!.github/workflows/enforce-pr-source.yml'
              - '!.github/workflows/refresh-manifest.yml'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/FUNDING.yml'
              - '!assets/screenshots/**'
              - '!.gitignore'
              - '!.env.example'

      # Catches the identical tree arriving twice (rebase, revert, rename).
      # Deliberately given NO `paths_filter`: two copies of that list can drift,
      # and the failure is silent — a stale green handed back for a path only one
      # of them knows about.
      - uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        id: skip_check

  # The same gate release.yml runs, moved forward so a vulnerable dep is caught
  # while the Cargo.lock change is under review rather than at release time,
  # where it blocks ten build slots and the fix is urgent. Shared composite
  # because an early warning that disagrees with the release gate is worse than
  # none.
  #
  # Sibling of clippy, not a parent: it compiles nothing, and an advisory hit
  # shouldn't hide the lint and test results.
  audit:
    name: audit
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (needs.changes.outputs.code == 'true' && needs.changes.outputs.should_skip != 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/cargo-audit

  # Compiles nothing, so it takes neither the system deps nor the cache — the
  # cheapest job here. Sibling of clippy for the reason audit is: a wrapping nit
  # shouldn't hide the lint and test results.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (needs.changes.outputs.code == 'true' && needs.changes.outputs.should_skip != 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: cargo fmt
        run: cargo fmt --all --check

  # Mirrors the local gate. The workspace `[lints]` set pedantic/style/complexity
  # to warn, so `-D warnings` promotes them to hard errors.
  #
  # `workflow_dispatch` bypasses the filters here and below: paths-filter has no
  # base ref to diff against, and a manual run is an explicit "run this now".
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (needs.changes.outputs.code == 'true' && needs.changes.outputs.should_skip != 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/linux-system-deps
      # Bare `install` takes the *active* toolchain, i.e. `rust-toolchain.toml`'s
      # pin and its `components`. Don't reintroduce `dtolnay/rust-toolchain`: it
      # calls `rustup default`, which that file outranks, so its `components:`
      # land on a toolchain nothing builds with and clippy goes missing.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-clippy
          cache-on-failure: true
      # One invocation covers both packages, and package *selection* is not what
      # decides that: cargo sets RUSTC_WORKSPACE_WRAPPER=clippy-driver for every
      # member it compiles, and clippy-driver skips non-primary packages only
      # under `--no-deps`. So `melodia-ui` is linted as a path dependency, lib
      # and build script both. A second `-p melodia-ui` step here would be
      # redundant — probe it with a planted `needless_return` in each before
      # believing otherwise.
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  # Tests. A sibling of clippy, not a child: nothing here reads clippy's output,
  # so chaining them made the gate's wall clock their sum, and what waits on that
  # gate is a person deciding whether to merge. The order bought a fast-fail that
  # skipped one build on a lint failure — runner minutes against merge latency,
  # and the minutes are the cheaper of the two. Runs the FULL suite including the
  # audio-dependent integration test `tests/headless.rs` behind a userspace ALSA
  # null device.
  #
  # Plain `cargo test`, NOT `cargo llvm-cov` — nobody reads a coverage delta to
  # decide a merge, and the instrumented build is the expensive half.
  # deploy-coverage.yml runs it on demand instead. Debug info stays at the
  # profile default, unlike that job: this is the one whose failures someone
  # actually reads a backtrace from.
  #
  # `CARGO_BUILD_JOBS: 4` is a memory cap, not a CPU match, and it overrides the
  # dev-machine jobs=8 in .cargo/config.toml. The peak is a single `rustc` on
  # `melodia-ui`, whose LLVM codegen threads draw jobserver tokens — so the job
  # count scales one process's peak. At jobs=8 a 16 GB runner does not fail, it
  # swaps, and the job runs for most of an hour looking like a hang.
  test:
    name: test
    runs-on: ubuntu-latest
    needs: [changes]
    env:
      CARGO_BUILD_JOBS: 4
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (needs.changes.outputs.code == 'true' && needs.changes.outputs.should_skip != 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/linux-system-deps
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-test
          cache-on-failure: true

      # `tests/headless.rs` boots AppState, which opens rodio's default device.
      # Runners have no sound card and the Azure kernel ships no
      # snd-dummy/snd-aloop, so point ALSA at alsa-lib's built-in userspace
      # `null` — no kernel module, daemon or extra package.
      - name: Set up dummy ALSA device (userspace null)
        run: |
          sudo tee /etc/asound.conf >/dev/null <<'EOF'
          pcm.!default { type null }
          ctl.!default { type null }
          EOF

      - name: cargo test
        run: cargo test --locked

  # Mark THIS as the required status check in branch protection. Green iff every
  # job passed or was skipped — `skipped` counting as a pass is what lets a
  # docs-only PR merge without a build, and why `changes` is a denylist.
  pr-validation:
    name: pr-validation
    if: always()
    needs: [changes, audit, fmt, clippy, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          # Adding a job is TWO edits — `needs:` above and this array. A job
          # named in only the first is unenforced: nothing here reads its
          # result, so the gate goes green on its failure.
          results=(
            "${{ needs.changes.result }}"
            "${{ needs.audit.result }}"
            "${{ needs.fmt.result }}"
            "${{ needs.clippy.result }}"
            "${{ needs.test.result }}"
          )
          for result in "${results[@]}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Job failed or was cancelled: $result"
              exit 1
            fi
          done
          echo "All jobs passed or were skipped"
