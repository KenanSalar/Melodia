name: Deploy Coverage

# Manual-only, and off the PR path entirely: the instrumented build is the most
# expensive thing in this repo's CI (it has OOM-killed the runner) and a coverage
# delta is not what anyone reads to decide a merge. A paths filter wouldn't help
# — "this merge touched Rust" is a different question from "someone wants a
# report today", and asking beats guessing for a job this expensive.
#
# `workflow_dispatch` takes a ref, so the Run workflow dropdown picks what gets
# measured and runs THAT branch's copy of this file. Two constraints on it: the
# button exists only because this workflow is on the default branch, and `deploy`
# is gated by the `github-pages` environment, whose branch policy allows `main`
# only. Anywhere else builds and uploads, then fails at the publish — widen the
# policy rather than expecting a second branch to deploy.
on:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an in-flight Pages deployment. Two dispatches in quick succession
# therefore queue two full instrumented builds, which still beats risking a
# half-published report.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # Debug info goes to zero rather than `line-tables-only`: LLVM source-based
    # coverage carries its own file/region table in `__llvm_covmap` and reads
    # nothing from DWARF, so the summary and annotated HTML render identically
    # without it, and nothing reads a backtrace out of this job.
    #
    # `CARGO_BUILD_JOBS` is the lever that actually keeps this inside the
    # runner's memory — a cap, not a CPU match, overriding the dev-machine jobs=8
    # in .cargo/config.toml. The peak is a single `rustc` on `melodia-ui`, whose
    # LLVM codegen threads draw jobserver tokens, so the job count scales one
    # process's peak. At jobs=8 a 16 GB runner swaps rather than failing, and
    # this build has OOM-killed it (143) outright.
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/linux-system-deps
      # `llvm-tools-preview`, which cargo-llvm-cov needs, comes from the pin's
      # `components` list rather than a workflow input.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-coverage
          cache-on-failure: true
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-llvm-cov

      # `tests/headless.rs` boots AppState, which opens rodio's default device.
      # Runners have no sound card and the Azure kernel ships no
      # snd-dummy/snd-aloop, so point ALSA at alsa-lib's built-in userspace
      # `null` — no kernel module, daemon or extra package.
      - name: Set up dummy ALSA device (userspace null)
        run: |
          sudo tee /etc/asound.conf >/dev/null <<'EOF'
          pcm.!default { type null }
          ctl.!default { type null }
          EOF

      # One instrumented run feeds both outputs — the report phases re-run no
      # tests.
      #
      # The regex drops `melodia-ui`'s generated `app-window.rs`, which is large
      # enough to swamp the denominator on its own; cargo-llvm-cov's built-in
      # excludes reach the sysroot and the registry but not a workspace member's
      # OUT_DIR. Scoped to that crate rather than every `build/*/out/`, so a build
      # script that one day generates exercised code doesn't vanish unnoticed.
      #
      # `pipefail` because the default shell is `bash -e` without it, so a failing
      # `report` would be swallowed by `tee` and publish an empty summary.
      - name: Run tests with coverage
        env:
          IGNORE_GENERATED: '.*/build/melodia-ui-[^/]*/out/.*'
        run: |
          set -o pipefail
          cargo llvm-cov --locked --no-report
          cargo llvm-cov report --html --ignore-filename-regex "$IGNORE_GENERATED"
          cargo llvm-cov report --summary-only --ignore-filename-regex "$IGNORE_GENERATED" \
            | tee coverage-summary.txt

      - name: Coverage summary to job log
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Coverage'
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: target/llvm-cov/html
          if-no-files-found: error
          retention-days: 30

  # Split from `coverage` so the Pages environment (and its write scopes) gate
  # only the publish, and a Pages failure still leaves the artifact behind.
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: [coverage]
    # A job-level block REPLACES the workflow-level one rather than merging, so
    # `contents: read` has to be restated here.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Same-run artifact, which is why there's no cross-workflow fetch here and
      # none of the `actions: read` grant, retry step and is-it-empty guard one
      # would need.
      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report
          path: site

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # The llvm-cov tree has its own root index.html, so it serves as-is.
      - name: Upload to Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
