name: Deploy Coverage

# Coverage runs here, once per merge to `dev` — not on every PR. The
# instrumented build is the most expensive thing in this repo's CI (it has
# OOM-killed the runner), and a coverage delta is not what anyone reads to
# decide a merge, so pr-validation.yml runs a plain `cargo test` instead.
# `workflow_dispatch` is the escape hatch for checking coverage off-cycle.
on:
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an in-flight Pages deployment; just queue the next one. The
# trade: two merges landing close together now queue two full instrumented
# builds rather than cancelling the first. Merges to `dev` are infrequent
# enough that this beats risking a half-published report.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # The instrumented link OOM-killed the runner (143) once the crate grew.
    # LLVM source-based coverage carries its own file/region table in
    # `__llvm_covmap` and reads nothing from DWARF, so debug info can go to zero
    # rather than `line-tables-only` — verified against cargo-llvm-cov 0.8.7,
    # both the summary and the annotated-source HTML render identically without
    # it. Nothing reads a backtrace out of this job, so there is no trade here.
    # It is worth ~0.5 GiB off the peak, though: the build step below is what
    # actually keeps this job inside the runner's memory.
    #
    # jobs=4 matches the runner's vCPUs, overriding the repo's dev-machine
    # jobs=8 in .cargo/config.toml. The second build phase overrides it again.
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/linux-system-deps
      # The pin drives the toolchain, and `llvm-tools-preview` (needed by
      # cargo-llvm-cov) comes from its `components` list, not a workflow input.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-coverage
          cache-on-failure: true
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-llvm-cov

      # `tests/headless.rs` boots AppState, which opens rodio's default output
      # device (cpal -> ALSA). Headless runners have no sound card, and the
      # GitHub Azure kernel ships no snd-dummy/snd-aloop module, so point ALSA's
      # default PCM at the built-in userspace `null` device (part of alsa-lib —
      # no kernel module, daemon, or extra package). rodio/cpal open it and
      # discard output; verified locally against tests/headless.rs.
      - name: Set up dummy ALSA device (userspace null)
        run: |
          sudo tee /etc/asound.conf >/dev/null <<'EOF'
          pcm.!default { type null }
          ctl.!default { type null }
          EOF

      # Built in two phases, because the peak is CONCURRENCY, not instrumentation.
      # The crate emits four large link targets — the lib test binary, the
      # `Melodia` bin, and the two integration tests — and each one links the
      # ~390k-line generated `app-window.rs` at roughly 5.3 GiB. Cargo happily
      # runs three of them at once, which measured 16.5 GiB against the runner's
      # 16 GB: it does not fail, it swaps, and a job that used to take 14 minutes
      # sits there for the better part of an hour looking like a hang.
      #
      # Phase 1 builds only the lib target, so the ~600 dependencies still
      # compile at full width. Phase 2 then has just the remaining links left and
      # runs them one at a time. Measured peak 9.78 GiB, down from 16.51 GiB.
      #
      # Do NOT collapse these back into one command to save a few seconds — the
      # margin they buy is the whole point, and the failure mode when it is gone
      # is a silent 50-minute job rather than an error.
      - name: Build dependencies and lib target (parallel)
        run: cargo llvm-cov --locked --no-report --lib

      # Phase 2 re-runs the lib tests as well as the rest — `--tests` means every
      # target with `test = true`, not just `tests/`. That is a second or two of
      # test time, and merging duplicate profraw counters cannot skew the result
      # because coverage is region-hit, not hit-count.
      - name: Build remaining targets and run tests (serialized links)
        env:
          CARGO_BUILD_JOBS: 1
        run: cargo llvm-cov --locked --no-report

      # Report phases don't re-run tests; they merge the profraw from both above.
      - name: Coverage reports
        run: |
          cargo llvm-cov report --html
          cargo llvm-cov report --summary-only | tee coverage-summary.txt

      - name: Coverage summary to job log
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Coverage'
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: target/llvm-cov/html
          if-no-files-found: error
          retention-days: 30

  # Split from `coverage` so the Pages environment (and its write scopes) gate
  # only the publish, and a Pages failure still leaves the artifact behind.
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: [coverage]
    # A job-level block REPLACES the workflow-level one rather than merging, so
    # `contents: read` has to be restated here.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Same-run artifact. This used to reach into the pr-validation workflow via
      # dawidd6/action-download-artifact, which needed `actions: read`, a retry
      # step and an is-it-empty guard because the fetch could come back with
      # nothing. Producing coverage in this workflow removes all of that.
      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report
          path: site

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # The llvm-cov HTML tree has its own index.html at the root, so it is
      # served as-is with no landing page of ours.
      - name: Upload to Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
