name: Deploy Coverage

# Manual-only and off the PR path: the instrumented build is the most expensive
# thing in this repo's CI, it has OOM-killed the runner, and a coverage delta is
# not what anyone reads to decide a merge. `workflow_dispatch` takes a ref, so
# the dropdown picks what gets measured and runs THAT branch's copy; `deploy` is
# then gated by the `github-pages` environment, whose branch policy allows `main`
# only, so any other ref builds and uploads and fails at the publish.
on:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an in-flight Pages deployment. Two dispatches in quick succession
# therefore queue two full instrumented builds, which beats a half-published one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # Debug info to zero rather than `line-tables-only`: LLVM coverage carries
    # its own region table in `__llvm_covmap` and reads no DWARF, so the report
    # renders identically without it and nothing reads a backtrace here.
    # `CARGO_BUILD_JOBS` is the memory cap `.claude/rules/ci-packaging.md`
    # measures; this is the build that has OOM-killed the runner (143) outright.
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/linux-system-deps
      # cargo-llvm-cov's `llvm-tools-preview` rides the pin's `components` list.
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: ci-coverage
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-llvm-cov
      - uses: ./.github/actions/headless-audio

      # One instrumented run feeds both outputs; the report phases re-run nothing.
      # The regex drops `melodia-ui`'s generated `app-window.rs`, big enough to
      # swamp the denominator alone and missed by cargo-llvm-cov's built-in
      # excludes, which reach the sysroot and registry but not a member's
      # OUT_DIR. Scoped to that crate, so a build script that one day generates
      # exercised code doesn't vanish. Without `pipefail`, `tee` swallows a
      # failing `report` and publishes an empty summary.
      - name: Run tests with coverage
        env:
          IGNORE_GENERATED: '.*/build/melodia-ui-[^/]*/out/.*'
        run: |
          set -o pipefail
          cargo llvm-cov --locked --no-report
          cargo llvm-cov report --html --ignore-filename-regex "$IGNORE_GENERATED"
          cargo llvm-cov report --summary-only --ignore-filename-regex "$IGNORE_GENERATED" \
            | tee coverage-summary.txt

      - name: Coverage summary to job log
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Coverage'
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: target/llvm-cov/html
          if-no-files-found: error
          retention-days: 30

  # Split from `coverage` so the Pages environment (and its write scopes) gate
  # only the publish, and a Pages failure still leaves the artifact behind.
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: [coverage]
    # A job-level block REPLACES the workflow-level one rather than merging, so
    # `contents: read` has to be restated here.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Same-run artifact, so no cross-workflow fetch and none of the
      # `actions: read` grant, retry step and is-it-empty guard one would need.
      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report
          path: site

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # The llvm-cov tree has its own root index.html, so it serves as-is.
      - name: Upload to Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
