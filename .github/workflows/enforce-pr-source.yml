name: Enforce PR Source Branch

on:
  pull_request:
    branches:
      - main

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR is from dev branch
        if: github.head_ref != 'dev'
        run: |
          echo "::error::Pull requests to main must come from the dev branch only"
          echo "::error::Current source branch: ${{ github.head_ref }}"
          echo "::error::Please create your PR from dev instead"
          exit 1

      - name: PR source branch is valid
        if: github.head_ref == 'dev'
        run: |
          echo "✅ Pull request is from dev branch - validation passed"
