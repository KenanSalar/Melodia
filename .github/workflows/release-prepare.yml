name: Release · prepare

# Everything that can say "no" in seconds, ahead of an hour of matrix. Called by
# release.yml; see there for the cycle this sits at the front of.

on:
  workflow_call:
    outputs:
      version:
        description: Version resolved from Cargo.toml.
        value: ${{ jobs.prepare.outputs.version }}
      tag:
        description: '`v` plus that version.'
        value: ${{ jobs.prepare.outputs.tag }}
      should_release:
        description: '"true" unless the tag is already published.'
        value: ${{ jobs.prepare.outputs.should_release }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      should_release: ${{ steps.gate.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version + tag from Cargo.toml
        id: meta
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Bare checkout, no toolchain, so a scrape rather than `cargo metadata`.
          # Anchor on `[workspace.package]`: the first `version = ` isn't it.
          VERSION="$(awk -F'"' '
            /^\[/                  { in_ws = ($0 == "[workspace.package]") }
            in_ws && /^version = / { print $2; exit }
          ' Cargo.toml)"
          if [[ -z "$VERSION" ]]; then
            echo "ERROR: no version in Cargo.toml's [workspace.package]" >&2
            exit 1
          fi
          # The tag triggers, but Cargo.toml is what the binary, all five package
          # formats and latest.json carry, so a mismatch would ship artifacts
          # naming the previous version; caught here, not an hour into the matrix.
          # A dispatch on a tag is checked like a push, per docs/RELEASING.md.
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $REF_NAME does not match Cargo.toml's v$VERSION."
            echo "::error::Fix the version on main and re-point the tag; see docs/RELEASING.md."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: v$VERSION"

      - name: Gate on existing release state
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          # Published means that cycle is over and a bump starts the next one.
          # Missing or still-draft both build.
          if STATE=$(gh release view "$TAG" --json isDraft -q '.isDraft' 2>/dev/null); then
            if [[ "$STATE" == "true" ]]; then
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "Existing draft for $TAG — will rebuild + update."
            else
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "Release $TAG is already published. Bump Cargo.toml's version to ship again."
            fi
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "No release for $TAG yet — will create draft."
          fi

      # Both MSI slots pin cargo-wix to an unreleased upstream commit; orphan it
      # and they fail ~15 min in with a cryptic `cargo install` error, so surface
      # it here in seconds. `git fetch <url> <sha>`, not `ls-remote`, which
      # enumerates ref tips only and goes empty once upstream pushes past the pin
      # though the commit stays reachable.
      - name: Preflight — cargo-wix git pin still resolves
        shell: bash
        run: |
          # Scraped from the action that installs it, so this can't preflight a
          # commit other than the one the MSI slots will fetch.
          WIX_ACTION=".github/actions/setup-wix/action.yml"
          PINNED_SHA="$(awk '/^ *rev: / { print $2; exit }' "$WIX_ACTION")"
          if [[ -z "$PINNED_SHA" ]]; then
            echo "::error::no 'rev:' line in $WIX_ACTION — did the install step move?"
            exit 1
          fi
          UPSTREAM="https://github.com/volks73/cargo-wix"
          PROBE="$(mktemp -d)"
          git init -q "$PROBE"
          if ! git -C "$PROBE" fetch --depth 1 "$UPSTREAM" "$PINNED_SHA"; then
            echo "::error::cargo-wix pin $PINNED_SHA is no longer reachable on $UPSTREAM."
            echo "::error::Upstream likely orphaned the commit (force-push that rewrote history,"
            echo "::error::deletion of the only branch keeping it reachable, or repo removal)."
            echo "::error::Remediation: (a) fork volks73/cargo-wix to KenanSalar/cargo-wix and"
            echo "::error::re-pin $WIX_ACTION's rev there, or (b) if 0.4.0 is now released on"
            echo "::error::crates.io, replace that action's install step with"
            echo "::error::taiki-e/install-action@v2 with tool: cargo-wix."
            exit 1
          fi
          echo "cargo-wix pin $PINNED_SHA reachable on $UPSTREAM"
