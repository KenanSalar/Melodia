name: Release

# A pushed `v*.*.*` tag starts a cycle and `Cargo.toml` must agree: `prepare`
# fails the run on a mismatch, so bump and tag are one act rather than two that
# can drift. A published tag short-circuits; a still-draft one is rebuilt in
# place (`--clobber`). The flip to published stays manual, drafts not being
# served by `/releases/latest/download/`, so the updater only sees a release once
# you have taken that QA step. Procedure: `docs/RELEASING.md`.
#
# The phases live in `release-*.yml`, which carry `workflow_call` and nothing
# else, so they cannot be dispatched by mistake. This file is the shape of a
# release: what runs, in what order, and the table of what ships.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  # OIDC token to mint the Sigstore certificate, plus write to the attestations
  # store. Verify with `gh attestation verify <file> --repo KenanSalar/Melodia`.
  id-token: write
  attestations: write

# One group for every release run, keyed on nothing: the shared resource is the
# draft, not the ref that reached it, and a per-ref group would leave two runs
# `--clobber`ing one draft. Releases never overlap, so a queued unrelated version
# costs only the wait; only one sits pending, a third cancelling the waiting one.
# Deliberately not repeated in the called workflows: matching group names on both
# sides of a call is how a run cancels its own caller.
concurrency:
  group: release
  cancel-in-progress: false

# Only `audit` narrows the grant above, and that is the shape it already had.
# The three called workflows take it whole on purpose: `prepare` reads release
# state including DRAFTS, which are visible only to a token with push access, and
# `build` needs all three of contents/id-token/attestations for the Sigstore
# step. A job-level block REPLACES rather than merges, so trimming one here is a
# change that fails at tag time and nowhere earlier. Worth doing deliberately,
# not as a side effect of moving files.
jobs:
  prepare:
    uses: ./.github/workflows/release-prepare.yml

  # Holds the release on a RustSec advisory: the updater ships executable code to
  # every installed client, so a delayed release beats a vulnerable one. Still a
  # gate though every PR ran it: the DB moves, and a tag can be weeks later.
  audit:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    # Reads Cargo.lock and nothing else; don't leave the workflow-level write
    # grant reachable from a job whose whole body is a third-party scanner.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/cargo-audit

  # One artifact + its prehashed minisign signature per slot, for `publish`.
  build:
    # `linux-rpm (aarch64)` rather than every matrix field in declaration order:
    # kind + arch names all ten uniquely. Display only; `needs:` keys off the id.
    name: ${{ matrix.kind }} (${{ matrix.arch }})
    needs: [prepare, audit]
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      # Saves minutes, at the cost of not learning if a second slot also fails.
      fail-fast: true
      matrix:
        # `arch` reaches the output filenames and build-{tarball,appimage,rpm}.sh's ARCH.
        include:
          - { target: x86_64-unknown-linux-gnu,  runner: ubuntu-latest,      kind: linux-tarball,  arch: x86_64  }
          - { target: x86_64-unknown-linux-gnu,  runner: ubuntu-latest,      kind: linux-appimage, arch: x86_64  }
          - { target: x86_64-unknown-linux-gnu,  runner: ubuntu-latest,      kind: linux-rpm,      arch: x86_64  }
          - { target: x86_64-unknown-linux-gnu,  runner: ubuntu-latest,      kind: linux-deb,      arch: x86_64  }
          - { target: x86_64-pc-windows-msvc,    runner: windows-2025-vs2026, kind: windows-msi,  arch: x86_64  }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm,   kind: linux-tarball,  arch: aarch64 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm,   kind: linux-appimage, arch: aarch64 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm,   kind: linux-rpm,      arch: aarch64 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm,   kind: linux-deb,      arch: aarch64 }
          - { target: aarch64-pc-windows-msvc,   runner: windows-11-arm,     kind: windows-msi,    arch: aarch64 }
    uses: ./.github/workflows/release-build.yml
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
      kind: ${{ matrix.kind }}
      arch: ${{ matrix.arch }}
      tag: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
    # Named rather than inherited, so each phase's reach is written down where it
    # is granted and `build` can't quietly acquire the publish token's scope.
    secrets:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SHARED_SECRET: ${{ secrets.LASTFM_SHARED_SECRET }}
      RADIO_BLOCKLIST: ${{ secrets.RADIO_BLOCKLIST }}
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
      MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    uses: ./.github/workflows/release-publish.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
    secrets:
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
      MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
