name: Linux system deps
description: >-
  Install Melodia's Linux build/test system dependencies (Slint femtovg fonts,
  ALSA, xkbcommon, Wayland, D-Bus, OpenSSL) with Azure apt-mirror failover and
  a time-bounded retry loop. `extra-packages` is what a packaging slot adds on
  top; the base set is the same everywhere so a gate and a release can't
  provision differently.

inputs:
  extra-packages:
    description: Space-separated packages to install alongside the base set.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: ./.github/actions/apt-mirror-failover

    # Defence in depth over the mirror swap, for short hiccups. The retry loop
    # only sees an exit code, and a mirror that accepts then stops sending
    # produces none: apt has no overall deadline, so the `timeout`s are the only
    # bound short of GitHub's six-hour cap, and a 124/137 in the warning below is
    # one firing rather than apt failing. `-k` because TERM is catchable and apt
    # defers it around dpkg; `sudo timeout`, an unprivileged one can't signal root.
    - name: Install Linux system deps
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        sudo systemctl stop unattended-upgrades || true

        # Acquire timeouts are per-connection idle limits, not transfer budgets:
        # 15s without a byte is a dead connection, whatever the download's size.
        apt_opts=(
          -o DPkg::Lock::Timeout=60
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=15
        )
        # Unquoted on purpose: the input is a package list, and splitting it on
        # whitespace is the whole point.
        packages=(
          libasound2-dev libxkbcommon-dev libfontconfig1-dev libfreetype-dev
          libwayland-dev libdbus-1-dev libssl-dev pkg-config
          $EXTRA_PACKAGES
        )
        for attempt in 1 2 3; do
          rc=0
          sudo timeout -k 30 120 apt-get update -qq "${apt_opts[@]}" && \
            sudo timeout -k 30 240 apt-get install -qq -y "${apt_opts[@]}" \
              "${packages[@]}" || rc=$?
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          echo "::warning::apt install (system deps) attempt $attempt failed (exit $rc)"
          # A kill can land mid-unpack, which the next apt refuses to work past.
          sudo dpkg --configure -a || true
          if [ "$attempt" -lt 3 ]; then
            sleep 15
          fi
        done
        echo "::error::apt install (system deps) failed after 3 attempts"
        exit 1
