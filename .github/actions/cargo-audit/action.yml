name: cargo audit
description: >-
  Fail on RustSec advisories covering any dependency in Cargo.lock. Shared by
  pr-validation.yml (early warning on a PR into main) and release.yml (the gate
  that holds a release). Deliberately takes no inputs — one policy, one verdict.

runs:
  using: composite
  steps:
    - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
      with:
        tool: cargo-audit

    # A prebuilt binary over the committed Cargo.lock, compiling nothing, so no
    # toolchain and no system deps. Not `--deny warnings`: it over-triggers on
    # transitive deps we don't control and on `yanked`, which is not a
    # vulnerability. Escape hatch is the `ignore` list in .cargo/audit.toml.
    - name: cargo audit
      shell: bash
      run: cargo audit --deny unsound --deny unmaintained
