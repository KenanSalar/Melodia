name: cargo audit
description: >-
  Fail on RustSec advisories covering any dependency in Cargo.lock. Shared by
  pr-validation.yml (early warning on a PR into main) and release.yml (the gate
  that holds a release). Deliberately takes no inputs — one policy, one verdict.

runs:
  using: composite
  steps:
    - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
      with:
        tool: cargo-audit

    # No toolchain and no system deps: a prebuilt binary reading the committed
    # Cargo.lock, compiling nothing, so rust-toolchain.toml never comes into it.
    #
    # `--deny warnings` would over-trigger on transitive deps we don't control
    # and on `yanked`, which is not a vulnerability. The escape hatch for the two
    # categories that do block is the `ignore` list in .cargo/audit.toml.
    - name: cargo audit
      shell: bash
      run: cargo audit --deny unsound --deny unmaintained
