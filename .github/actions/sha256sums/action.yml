name: Generate SHA256SUMS.txt
description: >-
  Checksum every file in `directory` into `SHA256SUMS.txt` beside them. Skips
  any SHA256SUMS.txt a prior run left, so it can't checksum itself, and fails on
  an empty directory rather than publishing a manifest of nothing.

inputs:
  directory:
    description: Directory to checksum.
    required: false
    default: artifacts

runs:
  using: composite
  steps:
    - name: Generate checksums
      shell: bash
      env:
        DIRECTORY: ${{ inputs.directory }}
      run: |
        cd "$DIRECTORY"
        shopt -s nullglob
        files=()
        for f in *; do
          [[ "$f" == "SHA256SUMS.txt" ]] && continue
          files+=("$f")
        done
        if [[ ${#files[@]} -eq 0 ]]; then
          echo "ERROR: no artifacts found to checksum"
          exit 1
        fi
        sha256sum "${files[@]}" > SHA256SUMS.txt
        echo "Generated checksums:"
        cat SHA256SUMS.txt
