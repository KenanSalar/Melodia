# Blank issues are off so bug reports carry the version, install method and
# platform the release matrix makes necessary to reproduce anything. Free-form
# writing isn't lost to that: `task.md` is a Markdown template, so it pre-fills
# a skeleton the author can rewrite or delete outright — which is the blank
# issue, minus the blank page.
#
# There is nowhere to send general questions yet. Enable Discussions in the
# repository settings and uncomment the block below to give them a door.
blank_issues_enabled: false
