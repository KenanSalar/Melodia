# Pinned because `[lints.clippy]` runs pedantic/style/complexity at `warn` and CI
# runs `-D warnings`: on a floating stable, every new lint fails an unrelated PR.
#
# `components` belongs here rather than in a CI action's `with:` — this file
# outranks `rustup default`, so those inputs never apply and the clippy, fmt and
# coverage jobs would silently lose their tooling. CI installs from it with a
# bare `rustup toolchain install`.
#
# A bump moves four things together — see CLAUDE.md's Important Conventions.
[toolchain]
channel = "1.97.0"
components = ["clippy", "rustfmt", "llvm-tools-preview"]
