# Virtual: every package is a member under `crates/`, the binary included. Nothing to
# select means cargo selects them all, so a bare `cargo test` is the whole workspace and
# `default-members` stays absent — narrowing it would drop every other member's test
# targets out of `--all-targets`.
#
# `winit` carries its own `[workspace]`; excluding it survives an upstream re-sync that
# drops that table.
[workspace]
# Spelled out because a virtual root infers nothing from its members: with a `[package]`
# here, edition 2024 implied resolver 3, and dropping that table silently fell back to
# resolver 1, which unifies features across build-dependencies and target-specific deps
# that 2024 keeps apart. Cargo warns, and a warning on a `metadata` call is not something
# the gate reads.
resolver = "3"
members = ["crates/*"]
exclude = ["winit"]

# Inherited by every package. Four toolchain-less scrapes (`release-prepare.yml`,
# `build-{rpm,appimage,tarball}.sh`) anchor on this table by name and take the
# first `version = ` inside it, so that entry stays first.
[workspace.package]
version = "0.12.0"
edition = "2024"
license = "AGPL-3.0-or-later"
# Lockstep with `rust-toolchain.toml` and `clippy.toml`'s `msrv`.
rust-version = "1.97"
# Here rather than on `[package]` because `ui::settings::about` reads
# `CARGO_PKG_REPOSITORY`, and a member that inherits nothing gets an empty string
# and only *logs* about it.
repository = "https://github.com/KenanSalar/Melodia"
homepage = "https://github.com/KenanSalar/Melodia"

# Every dependency is declared here rather than in the member that uses it, and the
# reason is the one `slint` taught: a drifted version resolves two copies of a crate
# and the build dies in a wall of `expected slint::Weak, found slint::Weak`. Members
# take `<dep>.workspace = true` and decide nothing.
[workspace.dependencies]
# `raw-window-handle-06` parents the rfd pickers; `unstable-winit-030` exposes
# `WinitWindowAccessor` for `drag_window()` and `WindowEvent::Resized` (slint-ui#2521,
# #6273, #4817); `renderer-femtovg` because the software renderer can't clip to
# `border-radius` (slint#4176).
slint = { version = "1.16.1", default-features = false, features = [
    "std",
    "backend-default",
    "accessibility",
    "compat-1-2",
    "raw-window-handle-06",
    "unstable-winit-030",
    "renderer-femtovg",
] }
# Must match the `slint` version above; the pair is declared adjacently for that.
slint-build = "1.16.1"

# Async runtime / utilities
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
async-compat = "0.2.5"
parking_lot = "0.12.5"

# `macros` stays despite every query going through runtime `query_as`, because
# `sqlx::migrate!` is re-exported only under `all(macros, migrate)`.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "derive", "macros"] }

# Audio
# The device stream `player::playback::output` opens, and the `ErrorKind`s
# `player::playback::stream_health` classifies; with rodio gone (#90) it is the whole
# output dependency. 0.18 is a floor: `tasks::audio_health` reads device loss off
# `DeviceNotAvailable`, which the ALSA host only began reporting there, and
# `output::device`'s ladder assumes its paused-until-`play()` streams.
cpal = "0.18.2"
# Everything decodes here, and deliberately against a newer Symphonia than the 0.5
# rodio pinned: 0.5 picks a demuxer off a two-byte marker and hands an MPEG-2 ADTS
# stream to the MP3 demuxer, where 0.6 scores candidates against the frames that
# follow. The feature list is the union of what stations serve and what
# `utils::audio_ext::AUDIO_EXTENSIONS` ingests: a gap is a format the scanner offers
# and nothing plays.
symphonia = { version = "0.6.1", default-features = false, features = [
    # The ADTS demuxer as well as the codec.
    "aac",
    "alac",
    "flac",
    # Also fragmented MP4, reachable only with the playlist's init segment spliced in
    # front: a media segment opens with `styp`/`moof` and this wants `ftyp` then `moov`.
    "isomp4",
    "mkv",
    # Wider than `mp3`, same crate: Layer I and II have no extension of their own and
    # arrive as an `.mka` track or an `.mp3` whose frame headers say so.
    "mpa",
    "ogg",
    "vorbis",
    "wav",
    "aiff",
    "caf",
    "pcm",
    # The RIFF demuxer resolves both ADPCM wave formats to codec types that would
    # otherwise have no decoder. Doesn't reach `.aifc` ADPCM, which the AIFC common
    # chunk rejects before any codec is looked up.
    "adpcm",
    # A file or mount that opens with a tag, which the probe chains past.
    "id3v1",
    "id3v2",
] }
# The graphic EQ cascades this crate's `Type::PeakingEQ` filters. `DirectForm1` keeps
# its delay line across a coefficient swap, so a slider drag injects no transient.
biquad = "0.6.0"
# Over the `rustfft` it wraps: a real input yields N/2+1 bins from a half-length
# transform, and its reusable scratch is what lets the per-frame analysis allocate
# nothing.
realfft = "3.5.0"
lofty = "0.24.0"

# Library indexing / file IO
walkdir = "2.5"
rand = "0.10.2"
notify = "8.2.0"
notify-debouncer-full = "0.7"
rayon = "1.12"
blake3 = "1.8.5"
natord = "1.0.9"
# Accent folding, so filter boxes narrow on the same spellings `tracks_fts`'s
# `remove_diacritics 2` tokenizer does.
unicode-normalization = "0.1.25"
# The superset of what a lofty picture's MIME type can name and what the cover
# pickers accept, which `media::image::artwork`'s `STORED_EXTENSIONS` is written
# against.
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp",
    "tiff",
    # Only `media::fetch::station_logo` produces this; a logo field is a favicon field.
    "ico",
] }
# `image`'s resamplers go through `get_pixel`; this is the same convolution over the
# flat slice with SIMD. It carries `unsafe` internally, which `unsafe_code = "deny"`
# can't reach; `media::image::image_decode::resize_rgb8` is the only place it is named.
fast_image_resize = { version = "6.1.0", features = ["image"] }
# Scale-on-decode, which `image`'s JPEG path can't reach (`zune-jpeg` picks reduced
# IDCTs by coefficient content, not by request). Every tier draws a cover far smaller
# than the store holds; `image_decode::decode_capped_to` falls back to `image`.
jpeg-decoder = "0.3.2"
lru = "0.18.2"

# Material 3 dynamic colour. Its `image`/`serde`/`libm` features stay off; we feed
# it quantized pixel data ourselves.
material-colors = "0.4.2"

# The backdrop's quantizer, beside rather than instead of the one above: median-cut
# over a fixed histogram answers "what is this cover mostly made of" in a fraction of
# a millisecond, where Celebi's k-means costs tens on photographic art.
color-thief = "0.2.2"

# Serde / config
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "6.0.0"

# HTTP (Deezer artist images, scrobbling, the radio directory and its streams)
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "query", "rustls", "stream"] }

# `Read` plus `Seek` over an HTTP response, backed by a ring an endless stream can't
# outgrow: `Decoder` wants a seekable reader, a live mount is neither finite nor
# rewindable. `default-features = false` is load-bearing: the default set pulls
# `reqwest/default-tls`, a second TLS stack (OpenSSL) landing in cargo-deb's `$auto`
# deps, and turning it off also drops `system-proxy`, so this path ignores `HTTP_PROXY`.
stream-download = { version = "0.24.3", default-features = false, features = ["reqwest-rustls"] }

# Icecast in-band metadata: the request header, the `icy-*` response headers, and the
# reader that strips the interleaved blocks so the decoder sees audio only.
icy-metadata = "0.6.0"

# Last.fm mandates MD5 for `api_sig`; nothing security-sensitive.
md5 = "0.8.1"

# Replaced `env_logger` when logs had to reach a file: the only candidate with size
# and age rotation in one criterion and no background thread. `colors` pulls
# `nu-ansi-term`, the only crate the swap adds against thirteen it retires.
log = "0.4.33"
flexi_logger = { version = "0.31.9", default-features = false, features = ["colors"] }

# Errors
thiserror = "2.0.19"

# Atomic file writes (settings/queue/search-history persistence)
tempfile = "3.27.0"

# OS integrations
souvlaki = "0.8.3"
rfd = "0.17.2"
# Hands a path to the OS default handler, for "Open Containing Folder".
open = "5.4.0"

# The single-instance socket: one abstraction over a Linux abstract unix socket and
# a Windows named pipe, whose *server* half would otherwise be `CreateNamedPipeW`, an
# FFI site no Linux runner compiles. `tokio` would pull `tokio/net`, left off above.
interprocess = "2.4.3"

# `minisign-verify` is zero-dep and verify-only. `semver` powers `is_upgrade()`, so a
# rolled-back `latest.json` reports `UpToDate` where string equality would downgrade.
# `futures-util` lets the download `.next().await` rather than buffer the asset.
minisign-verify = "0.2.5"
semver = "1.0.28"
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }

# Do NOT enable the `tokio` feature: cargo unifies it onto Slint's accesskit_unix →
# atspi → zbus chain, whose a11y thread has no tokio context and panics at startup.
# Always-on-top uses `zbus::blocking::*` inside `spawn_blocking`.
zbus = "5.18.0"

# Linux tray (StatusNotifierItem, no GTK); Windows/macOS take `tray-icon` below.
# Defaults off: ksni's default `tokio` feature turns on `zbus/tokio` and walks into
# the footgun above. `async-io` is mandatory (`compat` won't compile without an
# executor feature) and matches accesskit's.
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }

# Two glibc-only knobs, cfg-gated at their call sites since musl has neither:
# `mallopt` caps the per-thread arenas and pins the mmap/trim thresholds, which
# otherwise ratchet up until nothing returns to the kernel, and `malloc_trim` hands
# retained pages back.
libc = "0.2.189"

# `MoveFileExW(MOVEFILE_DELAY_UNTIL_REBOOT)` in `updater/install/swap.rs`, for when
# `Melodia.exe.old` is still loaded, and `GetUserDefaultLocaleName`. Declarations
# from here rather than a hand-rolled `extern` block only review can keep true.
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Graphics_Dwm", "Win32_Foundation", "Win32_Globalization"] }

# `canonicalize` returns the extended-length form (`\\?\C:\...`), which lands in
# `folders.path` and then fails to match the plain paths `read_dir` yields, greying
# Browse rows out as disk-only. Reached through `utils::canonicalize_path`.
dunce = "1.0.5"

# Defaults off to drop `gtk` and `libxdo`, the Linux paths `ksni` covers. The icon is
# created on the main thread, its menu events pumped from Slint's winit loop.
tray-icon = { version = "0.24.2", default-features = false }

# Embeds the `ICON` resource so the taskbar and Explorer entries aren't the generic
# placeholder. `wix/main.wxs` reads the same `assets/melodia.ico`.
winresource = "0.1.31"

glob = "0.3.4"

[workspace.lints.rust]
unused = { level = "warn", priority = -1 }
unsafe_code = "deny"
rust_2024_compatibility = { level = "warn", priority = -1 }
# Deliberately NOT enabling 1.97's `dead_code_pub_in_binary`: a test harness is
# itself an executable, so under `--all-targets` every `pub` item reachable only
# from `main.rs` reads as dead and the whole library API gets flagged.

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "deny", priority = -1 }
complexity  = { level = "warn", priority = -1 }
perf        = { level = "deny", priority = -1 }
style       = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }

unwrap_used   = "deny"
expect_used   = "warn"
panic         = "warn"
todo          = "warn"
unimplemented = "warn"
dbg_macro     = "warn"
print_stdout  = "warn"
print_stderr  = "warn"

await_holding_lock        = "deny"
await_holding_refcell_ref = "deny"
mutex_atomic              = "warn"
rc_mutex                  = "warn"

module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
similar_names           = "allow"
too_many_lines          = "allow"

unnecessary_literal_unwrap  = "warn"
field_reassign_with_default = "warn"
unnecessary_min_or_max      = "warn"
useless_vec                 = "warn"
io_other_error              = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
# DWARF is most of the size win; symbols stay because `strip = true` leaves panic
# backtraces as raw hex, useless in the crash reports users attach.
strip = "debuginfo"

# The `"*"` glob excludes workspace members, so this never reaches `melodia-ui`,
# which is also the build-memory peak the CI `CARGO_BUILD_JOBS` cap holds down.
[profile.dev.package."*"]
opt-level = 3

# winit 0.30.13 has no `wl_data_device` handling, so `WindowEvent::DroppedFile` fires
# everywhere but Wayland (rust-windowing/winit#1881). `winit/` is that tag plus 3
# commits reaching `ui::window_chrome::winit_filter`, cfg-gated to Linux and in-tree
# so a fresh clone and every CI runner build identically. Delete both once upstream
# lands native Wayland DnD.
[patch.crates-io]
winit = { path = "winit" }
