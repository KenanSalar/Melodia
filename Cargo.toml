[package]
name = "Melodia"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Cross-platform desktop music player (Slint + Rust)"
license.workspace = true
repository = "https://github.com/KenanSalar/Melodia"
homepage = "https://github.com/KenanSalar/Melodia"
authors = ["Kenan Salar <kenansalar@users.noreply.github.com>"]
keywords = ["music", "player", "audio", "slint"]
categories = ["multimedia::audio"]
# Unpublishable anyway — `melodia-ui` is `publish = false` and depended on by
# path with no version — so say so rather than letting `cargo publish` find out
# late. The metadata above still documents the repo.
publish = false

# `melodia-ui` holds nothing but the Slint compiler's output, split off because
# `cargo test` builds this package twice — rlib and `--test` harness — and the
# generated unit dwarfs the rest. As a dependency it builds once, and only when
# a `.slint` file or a catalog changes.
#
# `winit` already carries its own `[workspace]`; excluding it explicitly stops a
# future upstream re-sync that drops that table from pulling it in as a member.
[workspace]
members = ["melodia-ui"]
exclude = ["winit"]

[workspace.package]
# Inherited by both packages, so `melodia-ui` can't drift from the app. The
# three toolchain-less scrapes (`release.yml`, `build-rpm.sh`,
# `build-appimage.sh`) anchor on this table by name, not by position.
version = "0.11.0"
edition = "2024"
license = "AGPL-3.0-or-later"
# Kept in lockstep with `rust-toolchain.toml` and `clippy.toml`'s `msrv`.
rust-version = "1.97"

# Declared once rather than in both manifests, because a drifted *version*
# resolves two `slint` crates: the types `melodia-ui` generates then implement a
# different `ComponentHandle` than every file in `src/ui/` names, and the build
# dies in a wall of `expected slint::Weak, found slint::Weak`.
#
# `raw-window-handle-06` makes `Window::window_handle()` implement
# `HasWindowHandle` + `HasDisplayHandle`, which `ui::file_dialog` needs to parent
# the rfd pickers (Windows + macOS only; the Linux portal parents OS-side).
#
# `unstable-winit-030` exposes `WinitWindowAccessor`, for winit's `drag_window()`
# and `WindowEvent::Resized`. Slint 1.16 has no `start_system_move`
# (slint-ui#2521) and manual `set_position` math is broken on Wayland
# (slint-ui#6273) and `no-frame` windows (slint-ui#4817). Upstream may rename the
# feature in 1.17+.
#
# `renderer-femtovg`: the software renderer can't clip to `border-radius`
# (slint#4176), and its one advantage — lower idle RSS — stopped mattering once
# the `M_ARENA_MAX` cap in `main()` landed.
[workspace.dependencies]
slint = { version = "1.16.1", default-features = false, features = [
    "std",
    "backend-default",
    "accessibility",
    "compat-1-2",
    "raw-window-handle-06",
    "unstable-winit-030",
    "renderer-femtovg",
] }
# Only `melodia-ui` builds with this, but it has to match the `slint` version
# above — declaring the pair adjacently is the whole point of it being here.
slint-build = "1.16.1"

# Lowercase so `use melodia::…` stays idiomatic; the capitalised *package* name
# is what drives `target/release/Melodia` and `cargo run -p Melodia`.
[lib]
name = "melodia"
# Nothing consumes `melodia` as a library and every doc example is an
# `ignore` fence, so this only bought a rustdoc build per `cargo test`.
doctest = false

# cargo-deb metadata — drives the `.deb` build in release CI. The polkit helper
# + policy are what `services/updater/install/swap.rs` looks for at
# `/usr/libexec/melodia-update-helper`, for a branded auth dialog on updates.
#
# Dest paths follow the Debian FHS and match the RPM `%files` layout — except
# licences, where the distros' rules conflict and the divergence is deliberate:
# Policy 12.5 mandates `/usr/share/doc/<pkg>/copyright` and Debian has no
# `/usr/share/licenses`, while RPM's `%license` tags files `RPMFILE_LICENSE`
# rather than `RPMFILE_DOC` so they survive `--excludedocs`.
[package.metadata.deb]
section = "sound"
priority = "optional"
# cargo-deb ships a licence file into `usr/share/doc/melodia/copyright` verbatim
# only when it opens with DEP-5 keys (`has_copyright_metadata`, first ten lines);
# otherwise it *prepends* a header generated from `license` + `authors`, and the
# stanzas below become a second, contradictory declaration — one author, whole
# package AGPL, which the bundled fonts and the vendored winit falsify. Bare
# string rather than the `[path, skip-lines]` pair: cargo-deb models the pair as
# `Vec<String>`, so a numeric `0` there fails to deserialize.
license-file = "packaging/debian-copyright"
# `$auto` keeps cargo-deb's detected shared-library deps. The OR-alternative is
# forward compat: the updater invokes `pkexec` (which pulls `polkitd`), but
# `policykit-1` is transitional in Trixie and slated for removal, so apt picks
# `pkexec` there and falls back on Bookworm and older Ubuntu. The updater
# degrades to a "polkit not installed" error without it; declaring it is what
# Policy expects.
depends = "$auto, pkexec | policykit-1"
# `recommends`, not `depends`: both ship `debian/triggers` declaring
# `interest-noawait` on `/usr/share/{applications,icons/hicolor}`, so dpkg
# refreshes those caches once per transaction whenever any package lands files
# there — no maintainer scripts of our own. Minimal/server installs that never
# launch a GUI skip them, and the path activation is then a no-op.
# `scripts/build-rpm.sh`'s `%post`/`%postun` cover the Fedora equivalent.
recommends = "desktop-file-utils, hicolor-icon-theme"
extended-description = """
Melodia is a modern, local-first desktop music player with a Material
3-inspired interface. Your music collection stays entirely on your own
machine, with no accounts, streaming or cloud. It pairs a Slint user
interface with a pure-Rust backend: gapless playback via Rodio and
Symphonia (MP3, FLAC, M4A/AAC, OGG, WAV, ALAC and AIFF), a fast local
SQLite library with full-text search, browsing by album, artist, genre
and playlist, OS media controls (MPRIS), and pluggable themes including
system light/dark and Material You."""
# The reverse-DNS dest names match the AppStream component id, which is what
# makes KDE Discover / GNOME Software merge the desktop entry with the MetaInfo
# component instead of listing them separately.
assets = [
    ["target/release/Melodia", "usr/bin/melodia", "755"],
    ["scripts/Melodia.desktop", "usr/share/applications/com.github.kenansalar.melodia.desktop", "644"],
    ["packaging/com.github.kenansalar.melodia.metainfo.xml", "usr/share/metainfo/com.github.kenansalar.melodia.metainfo.xml", "644"],
    ["assets/icons/logo-with-background.svg", "usr/share/icons/hicolor/scalable/apps/melodia.svg", "644"],
    ["LICENSE", "usr/share/doc/melodia/LICENSE", "644"],
    # The fonts and the vendored winit fork are compiled into the binary, so this
    # package redistributes them and owes their licence text. Glob + trailing
    # slash, so a fourth file in `licenses/` needs no edit here — unlike
    # `wix/main.wxs`, which has to name each one.
    ["licenses/*", "usr/share/doc/melodia/licenses/", "644"],
    ["packaging/melodia-update-helper", "usr/libexec/melodia-update-helper", "755"],
    ["packaging/com.github.kenansalar.melodia.update.policy", "usr/share/polkit-1/actions/com.github.kenansalar.melodia.update.policy", "644"],
]

[dependencies]
# The Slint compiler's output, re-exported wholesale by `src/lib.rs` so the
# generated types stay reachable as `crate::AppWindow`, `crate::TrackRow`, ….
melodia-ui = { path = "melodia-ui" }

# Version and features in `[workspace.dependencies]`; `melodia-ui` takes the
# same line and the two must not drift.
slint.workspace = true

# Async runtime / utilities
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
async-compat = "0.2.5"
parking_lot = "0.12.5"

# `default-features = false` drops the unused `any` + `json`. `macros` stays
# despite every query going through runtime `query_as::<_, T>()` /
# `query_scalar`: `sqlx::migrate!` is re-exported only under
# `all(feature = "macros", feature = "migrate")`, so dropping it breaks
# `database/mod.rs`. `derive` covers `#[derive(sqlx::FromRow)]`.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "derive", "macros"] }

# Audio
rodio = { version = "0.22.2", default-features = false, features = [
    "playback",
    "symphonia-mp3",
    "symphonia-flac",
    "symphonia-isomp4",
    "symphonia-aac",
    "symphonia-ogg",
    "symphonia-vorbis",
    "symphonia-wav",
    "symphonia-pcm",
    "symphonia-alac",
    "symphonia-aiff",
] }
# Rodio 0.22 ships only low/high-pass BLT filters, so the graphic EQ cascades
# this crate's `Type::PeakingEQ` `DirectForm1` filters instead. `DirectForm1`
# keeps past inputs/outputs in its delay line, so a live coefficient swap (a
# slider drag) injects no transient.
biquad = "0.6.0"
# Real-to-complex FFT for the spectrum visualizer. Over raw `rustfft` (which it
# wraps) because a real input yields N/2+1 bins from a half-length complex FFT —
# no manual packing, half the work — and its planner hands out reusable scratch,
# which is what lets the per-frame analysis allocate nothing.
realfft = "3.5.0"
lofty = "0.24.0"

# Library indexing / file IO
walkdir = "2.5"
rand = "0.10.2"
notify = "8.2.0"
notify-debouncer-full = "0.7"
rayon = "1.12"
blake3 = "1.8.5"
natord = "1.0.9"
# Accent folding for the in-memory filter boxes, so they narrow on the same
# spellings `tracks_fts`'s `remove_diacritics 2` tokenizer does. Already in the
# lock file transitively, so this line costs no extra build.
unicode-normalization = "0.1.25"
# The format list is what a lofty picture's MIME type can name plus what the
# cover pickers accept, so it has to be the superset `media::artwork`'s
# `STORED_EXTENSIONS` is written against — a format the store may name but this
# list omits is one written to disk and never drawable.
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp",
    "tiff",
] }
# Every cover the app draws is resized, most of them more than once, and
# `image`'s own resamplers go through `get_pixel` — bounds-checked per output
# pixel, with the output size as their floor, so no store cap reaches them. This
# is the same convolution written over the flat slice with SIMD. It carries
# `unsafe` internally, which `unsafe_code = "deny"` doesn't reach and which is
# the reason the choice is written down here rather than arrived at by
# `cargo add`; `media::image_decode::resize_rgb8` is the only place it is named.
#
# The `image` feature is the compat layer that lets it read and write this tree's
# own buffers in place. Its `image` requirement is `0.25.6` against the `0.25.10`
# above, so it unifies rather than resolving a second copy, and it enables no
# format features of its own.
fast_image_resize = { version = "6.1.0", features = ["image"] }
# Scale-on-decode, which `image`'s JPEG path cannot reach: it decodes through
# `zune-jpeg`, whose reduced IDCTs are chosen by coefficient content and whose
# `DecoderOptions` exposes only size *limits*. Every tier draws a cover far
# smaller than the store holds, so decoding at 1/8 or 1/4 and resizing from
# there is work the full decode was always going to throw away — and it is
# nearly the whole store, JPEG being what the normalizer re-encodes to.
# `media::image_decode::decode_capped_to` is the only place it is named, and it
# falls back to `image` for every format and colour space this doesn't cover.
jpeg-decoder = "0.3.2"
lru = "0.18.2"

# Material 3 dynamic colour (Material You). Its optional `image`/`serde`/`libm`
# features stay off — we feed it quantized pixel data ourselves.
material-colors = "0.4.2"

# The backdrop's own quantizer, beside rather than instead of the one above: the
# two answer different questions, and only one of them is "what is this cover
# mostly made of". Median-cut over a fixed histogram, so it costs a fraction of
# a millisecond where Celebi's k-means costs tens on photographic art. Its one
# dependency, `rgb`, is already in the lock file.
color-thief = "0.2.2"

# Serde / config
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "6.0.0"

# HTTP (Deezer artist images, scrobbling)
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "query", "rustls", "stream"] }

# MD5 for Last.fm `api_sig` request signing (scrobbling). Last.fm mandates MD5;
# not used for anything security-sensitive.
md5 = "0.8.1"

# `flexi_logger` replaced `env_logger` when logs had to reach a file: it is the
# only candidate with size *and* age rotation in one criterion, and retention
# that needs no background thread. `services::logging` argues the rest.
#
# `textfilter` (its `regex` feature) stays off — we never match a regex inside a
# `RUST_LOG` directive. `colors` pulls `nu-ansi-term`, the only crate the swap
# adds against thirteen it retires, so don't "restore" env_logger for weight.
log = "0.4.33"
flexi_logger = { version = "0.31.9", default-features = false, features = ["colors"] }

# Errors
thiserror = "2.0.19"

# Atomic file writes (settings/queue/search-history persistence)
tempfile = "3.27.0"

# OS integrations
souvlaki = "0.8.3"
rfd = "0.17.2"
# Hands a path to the OS default handler — used by the track-row
# "Open Containing Folder" context-menu action.
open = "5.4.0"

# The single-instance socket (`services::single_instance`). One abstraction over
# a Linux abstract unix socket and a Windows named pipe, which is the whole
# reason for the dependency: `discord::ipc` hand-rolls the *client* half in std,
# but a named-pipe **server** means `CreateNamedPipeW` — an eighth FFI site no
# Linux runner ever compiles. Default features only; `tokio` would pull in
# `tokio/net`, which the runtime above deliberately leaves off.
interprocess = "2.4.3"

# Auto-updater — see `src/services/updater/`. `minisign-verify` is zero-dep and
# verify-only. `semver` powers `is_upgrade()`, so an older-or-equal manifest
# reports `UpToDate`; string equality on `version` would let a rolled-back
# `latest.json` force a downgrade. `futures-util`'s `StreamExt` lets the download
# `.next().await` reqwest's `bytes_stream()` rather than buffering 80–150 MiB.
minisign-verify = "0.2.5"
semver = "1.0.28"
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Do NOT enable the `tokio` feature. Cargo unifies it onto Slint's transitive
# accesskit_unix → atspi → zbus chain, and Slint's a11y thread has no tokio
# context — it panics at startup with "there is no reactor running". Always-on-
# top goes through `zbus::blocking::*` inside `spawn_blocking`, which needs
# neither executor flavour.
zbus = "5.18.0"

# Linux tray (StatusNotifierItem over D-Bus, no GTK). See `src/services/tray/`;
# Windows/macOS use `tray-icon` below. `default-features = false` drops ksni's
# default `tokio` feature, which turns on `zbus/tokio` and so walks straight into
# the footgun above. `async-io` is mandatory — ksni's `compat` module
# `compile_error!`s without an executor feature — and matches accesskit's;
# `blocking` gives the sync API the tray's own thread needs.
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }

# Two glibc-only malloc knobs, cfg-gated at their call sites since musl exposes
# neither. `mallopt` in `main.rs` caps the per-thread arenas — long-lived threads
# otherwise get one each, all committed slack on a mostly-idle player — and pins
# the mmap/trim thresholds, which otherwise ratchet up on every large free until
# nothing returns to the kernel. `malloc_trim` in `tasks/heap_trim.rs` hands
# retained pages back, once after startup churn and again after a bulk free.
libc = "0.2.189"

[target.'cfg(target_os = "windows")'.dependencies]
# `MoveFileExW(MOVEFILE_DELAY_UNTIL_REBOOT)` in `updater/install/swap.rs`, the
# fallback for when `Melodia.exe.old` is still loaded (a second window open at
# quit). `main()`'s early `remove_file` clears the stale rename otherwise.
# `Win32_Globalization` covers `GetUserDefaultLocaleName`: the declaration is the
# half of an FFI site nothing checks, so it comes from here rather than a
# hand-rolled `extern` block whose signature only review can keep true.
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Graphics_Dwm", "Win32_Foundation", "Win32_Globalization"] }

# `std::fs::canonicalize` returns the extended-length form (`\\?\C:\...`) on
# Windows, which lands in `folders.path` / `tracks.file_path` and then fails to
# match the plain `C:\...` paths `read_dir` yields — Browse rows go grey as
# "disk-only". `dunce` strips the prefix where the path fits in `MAX_PATH`.
# Reached through `utils::canonicalize_path`, which forwards to std elsewhere.
dunce = "1.0.5"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# `default-features = false` drops the `gtk` + `libxdo` features, which are the
# Linux paths (libappindicator / X11 `xdotool`) that `ksni` covers instead. The
# icon is created on the main thread and its menu events pumped from the winit
# loop Slint owns. See `src/services/tray/`.
tray-icon = { version = "0.24.2", default-features = false }

# Embeds an `ICON` resource into Melodia.exe, so the taskbar, Alt-Tab thumbnail
# and Explorer entry aren't the generic placeholder. A maintained fork of
# `winres` (which broke on rustc ≥ 1.61); works from MSVC and GNU alike.
# `wix/main.wxs` reads the same `assets/melodia.ico` for its shortcut and
# Add/Remove entry, so the EXE icon has one source.
[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "test-util"] }

# Defined at workspace level and inherited by both packages, so `melodia-ui`
# can't quietly sit outside the gate. Its generated module carries its own
# blanket `#[allow]` block, which already covers `unsafe_code`.
[lints]
workspace = true

[workspace.lints.rust]
unused = { level = "warn", priority = -1 }
unsafe_code = "deny"
rust_2024_compatibility = { level = "warn", priority = -1 }
# Deliberately NOT enabling 1.97's `dead_code_pub_in_binary`: a test harness is
# itself an executable, so under `--all-targets` it treats every `pub` item
# reachable only from `main.rs` as dead and flags the whole library API. Measured
# 670 hits, all from the test targets — 0 on `--lib`, 0 on `--bin`.

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "deny", priority = -1 }
complexity  = { level = "warn", priority = -1 }
perf        = { level = "deny", priority = -1 }
style       = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }

unwrap_used   = "deny"
expect_used   = "warn"
panic         = "warn"
todo          = "warn"
unimplemented = "warn"
dbg_macro     = "warn"
print_stdout  = "warn"
print_stderr  = "warn"

await_holding_lock        = "deny"
await_holding_refcell_ref = "deny"
mutex_atomic              = "warn"
rc_mutex                  = "warn"

module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
similar_names           = "allow"
too_many_lines          = "allow"

unnecessary_literal_unwrap  = "warn"
field_reassign_with_default = "warn"
unnecessary_min_or_max      = "warn"
useless_vec                 = "warn"
io_other_error              = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
# DWARF is most of the size win; the symbol table stays because `strip = true`
# (alias for "symbols") leaves panic backtraces as raw hex, useless in the crash
# reports users attach. rustc's own docs say to avoid it when crash-reporting.
strip = "debuginfo"

# The `"*"` glob is "all dependencies (but not any workspace member)", so this
# never reaches `melodia-ui`. Raising it for that crate specifically
# (`[profile.dev.package.melodia-ui]`) would be nearly free on rebuild time, but
# that crate is also the build-memory peak the CI `CARGO_BUILD_JOBS` cap holds
# down — measure before making the trade.
[profile.dev.package."*"]
opt-level = 3

# winit 0.30.13 has no `wl_data_device` handling, so `WindowEvent::DroppedFile`
# and friends fire everywhere but Wayland (rust-windowing/winit#1881, open since
# 2021, not being worked on). `winit/` is that tag plus 3 commits — PR #4009 by
# PeakKS, a WindowId fixup, URI percent-decoding — reaching
# `WinitWindowAccessor::on_winit_window_event` in
# `src/ui/window_chrome/winit_filter.rs`. The additions are cfg-gated to Linux, so
# every platform builds the fork.
#
# In-tree rather than a path to an external checkout, so a fresh clone and every
# CI runner build identically with no setup. To follow an upstream bump, rebase
# the fork onto the new tag and re-sync `winit/`; delete both once upstream
# lands native Wayland DnD.
[patch.crates-io]
winit = { path = "winit" }
