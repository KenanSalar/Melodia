[package]
name = "melodia-tidy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Repository-wide checks over the Melodia tree, as text rather than behaviour"
publish = false

[lib]
doctest = false

# Nothing depends on this crate, and it depends on as little as it can: every check here
# reads source text, so `cargo test -p melodia-tidy` should compile the walkers and stop.
# `melodia-core` is the one exception and the one kind of exception allowed — a pin that
# holds a shipped artifact against a constant needs the constant, and core is the bottom
# of the graph.
[dev-dependencies]
melodia-testkit = { path = "../melodia-testkit" }
melodia-core = { path = "../melodia-core" }
# The rules pin asks whether each `.claude/rules` `paths:` entry still matches anything, and
# half of them are globs. Hand-rolling `**` inside the one test that exists to catch silent
# drift is the wrong place to be clever.
glob.workspace = true

[lints]
workspace = true
