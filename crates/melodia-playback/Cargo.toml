[package]
name = "melodia-playback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The DSP chain, the mixer and the audio device for Melodia"
publish = false

[lib]
doctest = false

# No `reqwest`. The network is `melodia-audio`'s end of the chain, and neither manifest naming
# the other's third-party dependency is what makes that checkable rather than asserted.
[dependencies]
melodia-core = { path = "../melodia-core" }
melodia-audio = { path = "../melodia-audio" }

cpal.workspace = true
biquad.workspace = true
realfft.workspace = true
tokio.workspace = true
parking_lot.workspace = true
log.workspace = true
thiserror.workspace = true

# The exclusive backend. `alsa` stays on the version cpal already resolves, since a newer one
# is a second copy of it and of `alsa-sys`. `zbus` carries the card reservation and the
# real-time request, on its blocking API only (see the root manifest). `rustix` supplies the
# thread id and the RT-time limit rtkit asks for, and keeps `libc` out of this crate.
[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.11.0"
zbus.workspace = true
rustix = { version = "1.1.5", features = ["process", "thread"] }

# The exclusive backend on Windows. `wasapi` wraps COM over the same `windows` release cpal
# resolves, so it adds no second copy of it. `windows-sys` supplies the WASAPI error codes and
# the MMCSS registration the writer thread asks for.
[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.24.0"
windows-sys.workspace = true

[dev-dependencies]
melodia-testkit = { path = "../melodia-testkit" }

# Builds the `WasapiError` a refused claim arrives as. Held to the release `wasapi` resolves,
# since the error it wraps is that release's type and any other is a second copy.
[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-core = "0.62.2"

[lints]
workspace = true
