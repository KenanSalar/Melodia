[package]
name = "melodia-views"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Not decoration: `ui::settings::about` reads `CARGO_PKG_REPOSITORY` for the link it
# opens, and `ui::callbacks::updater` and `ui::settings::updater_settings` read
# `CARGO_PKG_VERSION` for the compare and the label. A member inheriting neither
# ships an empty link and a version of "0.0.0", and only *logs* about the first.
repository.workspace = true
description = "The Slint bridge: every view slice's wiring, the shared component library and the callbacks over both"
publish = false

[lib]
doctest = false

# The top of the graph and the whole point of it. **Neither `melodia-store` nor
# `melodia-net`**: the UI reaches the database through `melodia-app`'s library API and
# nowhere else, and it opens no socket at all. Both used to be one `use` away; now they
# are absent from this table, so rustc is what says no rather than a grep.
[dependencies]
melodia-core = { path = "../melodia-core" }
melodia-artwork = { path = "../melodia-artwork" }
melodia-platform = { path = "../melodia-platform" }
melodia-playback = { path = "../melodia-playback" }
melodia-engine = { path = "../melodia-engine" }
# The Settings page drives the Last.fm and ListenBrainz connect flows and reads
# Discord's status inline, so this edge is real rather than routed through a facade.
melodia-integrations = { path = "../melodia-integrations" }
melodia-app = { path = "../melodia-app" }
melodia-ui = { path = "../melodia-ui" }

slint.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-compat.workspace = true
parking_lot.workspace = true
# Shuffle-all picks its starting row here.
rand.workspace = true
# Accent folding for the per-view filter boxes, matching what `tracks_fts` does.
unicode-normalization.workspace = true
image.workspace = true
lru.workspace = true
material-colors.workspace = true
chrono.workspace = true
log.workspace = true
# Reached only through `ui::file_dialog::parented`, which is the sole place it may be named.
rfd.workspace = true
# `ui::launcher`, and `open::that_detached` rather than `that`.
open.workspace = true
futures-util.workspace = true

[dev-dependencies]
melodia-testkit = { path = "../melodia-testkit" }
tempfile.workspace = true

[lints]
workspace = true
