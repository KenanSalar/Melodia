[package]
name = "melodia-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Decode and the source kinds that can feed Melodia's playback chain"
publish = false

[lib]
doctest = false

# No `cpal`. Everything under the DSP chain is `melodia-playback`'s, and the check that the two
# tiers stayed apart is that neither manifest names the other's third-party dependency.
[dependencies]
melodia-core = { path = "../melodia-core" }
# The four HTTP primitives the live trio and HLS take: `is_http`, `is_http_url`, `get_capped`
# and `get_capped_text`.
melodia-net = { path = "../melodia-net" }

symphonia.workspace = true
reqwest.workspace = true
stream-download.workspace = true
icy-metadata.workspace = true
tokio.workspace = true
parking_lot.workspace = true
# `SeekError`, the one error in this crate that is its own type rather than `AppError`.
thiserror.workspace = true
log.workspace = true

[dev-dependencies]
melodia-testkit = { path = "../melodia-testkit" }
# The decode tests build tagged fixtures and write them into a throwaway directory.
lofty.workspace = true
tempfile.workspace = true

[lints]
workspace = true
