[package]
name = "melodia-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-or-later"
description = "Compiled Slint UI for Melodia"
publish = false

[dependencies]
# Must stay identical to the root manifest's `slint` line — the rationale for
# each feature lives there. Cargo unifies features across the two packages
# regardless; spelling them out is what keeps `cargo build -p melodia-ui`
# correct on its own.
slint = { version = "1.16.1", default-features = false, features = [
    "std",
    "backend-default",
    "accessibility",
    "compat-1-2",
    "raw-window-handle-06",
    "unstable-winit-030",
    "renderer-femtovg",
] }

[build-dependencies]
slint-build = "1.16.1"

[lints]
workspace = true
